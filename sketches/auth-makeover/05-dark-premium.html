<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPMB — Masuk (Varian 5: Dark Premium)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --primary: #8B96F5; --primary-hover: #A5ADF8; --primary-strong: #6C78F5;
    --primary-glow: rgba(108,120,245,.55); --primary-soft: rgba(108,120,245,.14);
    --success: #2DC99C; --danger: #F27389; --warning: #F5CC66; --info: #5BA8EC;
    --bg: #0E0F1A; --bg-2: #151627; --panel: #1A1B2E; --panel-2: #20223A;
    --border: #2C2E4A; --border-soft: #232540;
    --text-1: #F2F3FA; --text-2: #A9ADC6; --text-3: #6E7396;
    --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 14px;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans); min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; color: var(--text-2); background: var(--bg);
    background-image:
      radial-gradient(800px 500px at 80% -10%, rgba(108,120,245,.18), transparent 60%),
      radial-gradient(600px 400px at 0% 110%, rgba(168,81,215,.12), transparent 60%);
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  .card {
    position: relative; width: 100%; max-width: 420px;
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border: 1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: 0 24px 60px -12px rgba(0,0,0,.6), 0 0 0 1px rgba(108,120,245,.06);
    padding: 40px 36px 32px;
  }
  .card::before {
    content: ''; position: absolute; inset: 0; border-radius: var(--r-lg); pointer-events: none;
    background: radial-gradient(400px 160px at 50% 0%, rgba(108,120,245,.12), transparent 70%);
  }
  .brand { position: relative; text-align: center; margin-bottom: 28px; }
  .logo {
    width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 15px;
    background: linear-gradient(135deg, var(--primary-strong), #A851D7);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px;
    box-shadow: 0 0 24px var(--primary-glow), 0 8px 20px -6px rgba(0,0,0,.5);
  }
  .brand h1 { font-size: 22px; font-weight: 800; color: var(--text-1); letter-spacing: -0.01em; }
  .brand p { margin-top: 6px; font-size: 13px; color: var(--text-3); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-1); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  .input-wrap i.lead { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-3); pointer-events: none; transition: color .15s; }
  .input-wrap input {
    width: 100%; height: 46px; border: 1px solid var(--border); border-radius: var(--r-xs);
    background: rgba(255,255,255,.03); padding: 0 40px 0 38px; font-family: var(--font-sans);
    font-size: 14px; color: var(--text-1); transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .input-wrap input::placeholder { color: var(--text-3); }
  .input-wrap input:focus { outline: none; border-color: var(--primary); background: rgba(255,255,255,.05); box-shadow: 0 0 0 3px rgba(108,120,245,.18); }
  .input-wrap input:focus ~ i.lead { color: var(--primary); }
  .input-wrap .toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border: 0; background: transparent; color: var(--text-3); cursor: pointer; border-radius: var(--r-xs); font-size: 14px;
  }
  .input-wrap .toggle:hover { color: var(--primary); }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; }
  .checkbox { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; color: var(--text-1); }
  .checkbox input { width: 16px; height: 16px; accent-color: var(--primary-strong); cursor: pointer; }
  .link { font-size: 13px; font-weight: 600; color: var(--primary); text-decoration: none; }
  .link:hover { text-decoration: underline; color: var(--primary-hover); }
  .btn-primary {
    display: flex; width: 100%; height: 48px; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, var(--primary-strong), #7B6CF5); color: #fff; border: 0;
    border-radius: var(--r-sm); font-family: var(--font-sans); font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 8px 24px -6px var(--primary-glow); transition: transform .1s, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: scale(.985); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 28px 0 20px; color: var(--text-3); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-social {
    display: flex; height: 44px; align-items: center; justify-content: center; gap: 8px;
    background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all .15s;
  }
  .btn-social:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-3); }
  .foot a { color: var(--primary); font-weight: 600; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  .back { position: fixed; top: 16px; left: 16px; z-index: 5; }
  .back a {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    color: var(--text-2); text-decoration: none; background: var(--panel); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: var(--r-sm); box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .back a:hover { color: var(--primary); border-color: var(--primary); }
</style>
</head>
<body>
  <div class="back"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Semua varian</a></div>

  <!-- LOGIN -->
  <div class="card" id="view-login">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1>Masuk ke SPMB</h1>
      <p>Penerimaan Murid Baru — akses akun Anda</p>
    </div>
    <form onsubmit="return false;">
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope lead"></i>
          <input id="email" type="email" placeholder="nama@email.com" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label for="password">Kata Sandi</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock lead"></i>
          <input id="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password">
          <button class="toggle" type="button" onclick="togglePw(this)" aria-label="Tampilkan kata sandi"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>
      <div class="row-between">
        <label class="checkbox"><input type="checkbox" checked> Ingat saya</label>
        <a class="link" href="#">Lupa kata sandi?</a>
      </div>
      <button class="btn-primary" onclick="fakeSubmit(this)">Masuk <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <div class="divider">atau masuk dengan</div>
    <div class="social-row">
      <button class="btn-social"><i class="fa-brands fa-google"></i> Google</button>
      <button class="btn-social"><i class="fa-solid fa-school"></i> Akun Sekolah</button>
    </div>
    <div class="foot">Belum punya akun? <a href="#" onclick="showRegister(event)">Daftar sekarang</a></div>
  </div>

  <!-- REGISTER -->
  <div class="card hidden" id="view-register" style="max-width:440px">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1>Buat Akun SPMB</h1>
      <p>Mulai proses pendaftaran Anda</p>
    </div>
    <form onsubmit="return false;">
      <div class="field">
        <label for="r-name">Nama Lengkap</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user lead"></i>
          <input id="r-name" type="text" placeholder="Nama sesuai identitas">
        </div>
      </div>
      <div class="field">
        <label for="r-email">Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope lead"></i>
          <input id="r-email" type="email" placeholder="nama@email.com" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label for="r-password">Kata Sandi</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock lead"></i>
          <input id="r-password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password">
          <button class="toggle" type="button" onclick="togglePw(this)" aria-label="Tampilkan kata sandi"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>
      <div class="field">
        <label for="r-password2">Ulangi Kata Sandi</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock lead"></i>
          <input id="r-password2" type="password" placeholder="Ketik ulang kata sandi" autocomplete="new-password">
          <button class="toggle" type="button" onclick="togglePw(this)" aria-label="Tampilkan kata sandi"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>
      <label class="checkbox" style="margin: 4px 0 22px;"><input type="checkbox" checked> Saya menyetujui <a class="link" href="#">syarat &amp; ketentuan</a></label>
      <button class="btn-primary" onclick="fakeSubmit(this)">Daftar <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <div class="foot">Sudah punya akun? <a href="#" onclick="showLogin(event)">Masuk</a></div>
  </div>

<script>
  function togglePw(btn) {
    var input = btn.parentElement.querySelector('input');
    var icon = btn.querySelector('i');
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
  }
  function fakeSubmit(btn) {
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
    setTimeout(function(){ btn.disabled = false; btn.innerHTML = original; }, 1400);
  }
  function showRegister(e) { e.preventDefault(); document.getElementById('view-login').classList.add('hidden'); document.getElementById('view-register').classList.remove('hidden'); }
  function showLogin(e) { e.preventDefault(); document.getElementById('view-register').classList.add('hidden'); document.getElementById('view-login').classList.remove('hidden'); }
</script>
</body>
</html>
