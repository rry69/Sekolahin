<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPMB — Masuk (Varian 1: Centered Card)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --primary: #6C78F5; --primary-hover: #5A64E8; --primary-active: #4A54C9;
    --primary-400: #8B96F5; --primary-100: #E5E9FC; --primary-50: #F1F3FE;
    --success: #2DC99C; --danger: #F27389; --warning: #F5CC66; --info: #248FE6;
    --n0: #FFFFFF; --n50: #F8F9FB; --n100: #F5F6FA; --n150: #EEF0F4;
    --n200: #E0E2E8; --n300: #C9CDD6; --n400: #9AA0AE; --n500: #6B7280;
    --n700: #3F4451; --n900: #1A1A2E;
    --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
    --shadow-sm: 0 1px 3px rgba(16,24,40,.10), 0 1px 2px rgba(16,24,40,.06);
    --shadow-md: 0 4px 8px -2px rgba(16,24,40,.10), 0 2px 4px -2px rgba(16,24,40,.06);
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans); background: var(--n100); color: var(--n700);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo {
    width: 48px; height: 48px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 20px; box-shadow: 0 4px 14px -4px rgba(108,120,245,.5);
  }
  .brand-name { font-size: 20px; font-weight: 800; color: var(--n900); letter-spacing: -0.01em; }
  .brand-name small { display: block; font-size: 11px; font-weight: 600; color: var(--n500); letter-spacing: 0.05em; margin-top: 2px; }
  .card {
    width: 100%; max-width: 420px; background: var(--n0);
    border: 1px solid var(--n150); border-radius: var(--r-lg);
    box-shadow: var(--shadow-md); padding: 36px 36px 32px;
  }
  .card-head { text-align: center; margin-bottom: 28px; }
  .card-head h1 { font-size: 22px; font-weight: 800; color: var(--n900); letter-spacing: -0.01em; }
  .card-head p { margin-top: 6px; font-size: 13px; color: var(--n500); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--n700); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  .input-wrap i.lead {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: var(--n400); pointer-events: none; transition: color .15s;
  }
  .input-wrap input {
    width: 100%; height: 44px; border: 1px solid var(--n200); border-radius: var(--r-xs);
    background: var(--n0); padding: 0 40px 0 38px; font-family: var(--font-sans);
    font-size: 14px; color: var(--n900); transition: border-color .15s, box-shadow .15s;
  }
  .input-wrap input::placeholder { color: var(--n400); }
  .input-wrap input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(108,120,245,.22);
  }
  .input-wrap input:focus ~ i.lead { color: var(--primary); }
  .input-wrap .toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border: 0; background: transparent; color: var(--n400); cursor: pointer;
    border-radius: var(--r-xs); font-size: 14px; transition: color .15s;
  }
  .input-wrap .toggle:hover { color: var(--primary); }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; }
  .checkbox { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--n500); }
  .checkbox input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; border-radius: var(--r-xs); }
  .link { font-size: 13px; font-weight: 600; color: var(--primary); text-decoration: none; }
  .link:hover { color: var(--primary-hover); text-decoration: underline; }
  .btn-primary {
    display: flex; width: 100%; height: 48px; align-items: center; justify-content: center; gap: 8px;
    background: var(--primary); color: #fff; border: 0; border-radius: var(--r-sm);
    font-family: var(--font-sans); font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px -4px rgba(108,120,245,.5); transition: background .15s, transform .1s;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:active { background: var(--primary-active); transform: scale(.985); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 28px 0 20px; color: var(--n400); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--n150); }
  .social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-social {
    display: flex; height: 44px; align-items: center; justify-content: center; gap: 8px;
    background: var(--n0); border: 1px solid var(--n200); border-radius: var(--r-sm);
    font-size: 13px; font-weight: 600; color: var(--n700); cursor: pointer; transition: all .15s;
  }
  .btn-social:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-50); }
  .card-foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--n500); }
  .card-foot a { color: var(--primary); font-weight: 600; text-decoration: none; }
  .card-foot a:hover { text-decoration: underline; }
  .back { position: fixed; top: 16px; left: 16px; }
  .back a {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    color: var(--n500); text-decoration: none; background: var(--n0); border: 1px solid var(--n150);
    padding: 7px 12px; border-radius: var(--r-sm); box-shadow: var(--shadow-sm);
  }
  .back a:hover { color: var(--primary); border-color: var(--primary-400); }
  .error-msg { display: none; margin-top: 6px; font-size: 12px; color: var(--danger); }
  .error-msg i { margin-right: 4px; }
  .field.error .input-wrap input { border-color: var(--danger); }
  .field.error .error-msg { display: block; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="back"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Semua varian</a></div>

  <!-- ============ LOGIN ============ -->
  <div id="view-login">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="brand-name">SPMB<small>Penerimaan Murid Baru</small></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h1>Masuk</h1>
        <p>Silakan masuk untuk melanjutkan pendaftaran</p>
      </div>

      <form onsubmit="return false;">
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope lead"></i>
            <input id="email" type="email" placeholder="nama@email.com" autocomplete="username">
          </div>
          <div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> Email tidak valid</div>
        </div>

        <div class="field" id="f-password">
          <label for="password">Kata Sandi</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock lead"></i>
            <input id="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password">
            <button class="toggle" type="button" onclick="togglePw(this)" aria-label="Tampilkan kata sandi"><i class="fa-regular fa-eye"></i></button>
          </div>
          <div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> Kata sandi salah</div>
        </div>

        <div class="row-between">
          <label class="checkbox"><input type="checkbox" checked> Ingat saya</label>
          <a class="link" href="#">Lupa kata sandi?</a>
        </div>

        <button class="btn-primary" onclick="fakeSubmit(this)">Masuk <i class="fa-solid fa-arrow-right"></i></button>
      </form>

      <div class="divider">atau masuk dengan</div>
      <div class="social-row">
        <button class="btn-social"><i class="fa-brands fa-google"></i> Google</button>
        <button class="btn-social"><i class="fa-solid fa-school"></i> Akun Sekolah</button>
      </div>

      <div class="card-foot">Belum punya akun? <a href="#" onclick="showRegister(event)">Daftar sekarang</a></div>
    </div>
  </div>

  <!-- ============ REGISTER ============ -->
  <div id="view-register" class="hidden">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="brand-name">SPMB<small>Penerimaan Murid Baru</small></div>
    </div>

    <div class="card" style="max-width:440px">
      <div class="card-head">
        <h1>Buat Akun</h1>
        <p>Daftar untuk mulai proses pendaftaran</p>
      </div>

      <form onsubmit="return false;">
        <div class="field">
          <label for="r-name">Nama Lengkap</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user lead"></i>
            <input id="r-name" type="text" placeholder="Nama sesuai identitas">
          </div>
        </div>
        <div class="field">
          <label for="r-email">Email</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope lead"></i>
            <input id="r-email" type="email" placeholder="nama@email.com" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="r-password">Kata Sandi</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock lead"></i>
            <input id="r-password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password">
            <button class="toggle" type="button" onclick="togglePw(this)" aria-label="Tampilkan kata sandi"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="field">
          <label for="r-password2">Ulangi Kata Sandi</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock lead"></i>
            <input id="r-password2" type="password" placeholder="Ketik ulang kata sandi" autocomplete="new-password">
            <button class="toggle" type="button" onclick="togglePw(this)" aria-label="Tampilkan kata sandi"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>

        <label class="checkbox" style="margin: 4px 0 22px;"><input type="checkbox" checked> Saya menyetujui <a class="link" href="#">syarat &amp; ketentuan</a></label>

        <button class="btn-primary" onclick="fakeSubmit(this)">Daftar <i class="fa-solid fa-arrow-right"></i></button>
      </form>

      <div class="card-foot">Sudah punya akun? <a href="#" onclick="showLogin(event)">Masuk</a></div>
    </div>
  </div>

<script>
  function togglePw(btn) {
    var input = btn.parentElement.querySelector('input');
    var icon = btn.querySelector('i');
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
  }
  function fakeSubmit(btn) {
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
    setTimeout(function(){
      btn.disabled = false;
      btn.innerHTML = original;
    }, 1400);
  }
  function showRegister(e) { e.preventDefault(); document.getElementById('view-login').classList.add('hidden'); document.getElementById('view-register').classList.remove('hidden'); }
  function showLogin(e) { e.preventDefault(); document.getElementById('view-register').classList.add('hidden'); document.getElementById('view-login').classList.remove('hidden'); }
</script>
</body>
</html>
